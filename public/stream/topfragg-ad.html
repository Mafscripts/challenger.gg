<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>TopFragg • Stream Overlay</title>
  <style>
    :root { color-scheme: dark; --cyan: #14d8ff; --ink: #0b1520; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent !important; }
    body { font-family: Arial, Helvetica, sans-serif; -webkit-font-smoothing: antialiased; }
    .ad { position: relative; display: grid; grid-template-columns: 58px minmax(0, 1fr); gap: 15px; align-items: center; width: min(464px, calc(100vw - 16px)); height: 124px; margin: 8px; padding: 15px 18px; overflow: hidden; border: 1px solid #14d8ff40; border-radius: 13px; background: linear-gradient(115deg, #132632f5, #0b141ef7 65%); box-shadow: inset 0 1px 0 #ffffff08; }
    .ad::before { position: absolute; inset: 0 auto 0 0; width: 3px; background: var(--cyan); content: ""; box-shadow: 0 0 22px #14d8ff50; }
    .brand-mark { width: 58px; height: 58px; perspective: 500px; }
    .brand-mark svg { display: block; width: 100%; height: 100%; transform-origin: center; animation: logo-turn 24s cubic-bezier(.4, 0, .2, 1) infinite; }
    .copy { min-width: 0; }
    .eyebrow { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 9px; }
    .wordmark { color: white; font-size: 12px; font-weight: 900; letter-spacing: -.035em; }
    .wordmark span { color: var(--cyan); }
    .live-label { display: inline-flex; align-items: center; gap: 5px; color: #89a5b8; font-size: 7px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
    .live-label::before { content: ""; width: 4px; height: 4px; border-radius: 50%; background: var(--cyan); }
    .messages { position: relative; height: 49px; }
    .message { position: absolute; inset: 0; opacity: 0; animation: message-cycle 32s ease infinite both; animation-delay: calc(var(--i) * 8s - .64s); }
    .message h1, .message h2 { margin: 0; color: #f4faff; font-size: 19px; font-weight: 900; letter-spacing: -.025em; line-height: 1.15; }
    .message p { margin: 6px 0 0; color: #9db2c3; font-size: 10px; font-weight: 500; line-height: 1.3; }
    .message strong { color: var(--cyan); font-weight: 900; }
    .footer { display: flex; align-items: center; gap: 8px; margin-top: 8px; padding-top: 8px; border-top: 1px solid #ffffff0c; }
    .footer a { color: var(--cyan); font-size: 10px; font-weight: 900; letter-spacing: .08em; text-decoration: none; }
    .footer svg { width: 11px; height: 11px; color: var(--cyan); }
    .footer span { margin-left: auto; color: #6d899c; font-size: 6px; font-weight: 800; letter-spacing: .13em; }
    .progress { position: absolute; bottom: 0; left: 0; width: 100%; height: 2px; overflow: hidden; background: #14d8ff0b; }
    .progress::after { content: ""; display: block; width: 100%; height: 100%; transform-origin: left; background: linear-gradient(90deg, #14d8ff25, #14d8ff9c); animation: progress 8s linear infinite; }
    @keyframes message-cycle { 0% { opacity: 0; transform: translateY(5px); } 2%, 22% { opacity: 1; transform: translateY(0); } 25%, 100% { opacity: 0; transform: translateY(-5px); } }
    @keyframes logo-turn { 0%, 88% { transform: rotateY(0deg); } 100% { transform: rotateY(360deg); } }
    @keyframes progress { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @media (prefers-reduced-motion: reduce) { .brand-mark svg, .progress::after { animation: none; } .message { animation: none; display: none; } .message:first-child { display: block; opacity: 1; } .messages { height: auto; } .messages::after { content: "First 250 sign-ups: 5 free credits · XP ladders · Cash prizes"; display: block; margin-top: 6px; color: #9db2c3; font-size: 8px; line-height: 1.4; } .message:first-child { position: static; } .message:first-child p { display: none; } }
  </style>
</head>
<body>
  <aside class="ad" aria-label="TopFragg: free entry tournaments, five free credits for the first 250 sign-ups, XP ladders and cash prizes. Sign up at topfragg.gg.">
    <div class="brand-mark" aria-hidden="true">
      <!-- Current TopFragg brand mark, matching src/components/brand/TopfraggLogo.jsx. -->
      <svg viewBox="0 0 44 44" xmlns="http://www.w3.org/2000/svg">
        <rect x="2.5" y="2.5" width="39" height="39" rx="10" fill="#071018" stroke="#183342"/>
        <path d="M22 7.75 34.25 12.5v9.45c0 7.25-5.08 11.6-12.25 14.3-7.17-2.7-12.25-7.05-12.25-14.3V12.5L22 7.75Z" fill="#08141D" stroke="#14D8FF" stroke-width="2"/>
        <path d="M14 16.25h16M22 16.25v13.5M16.5 23h11" stroke="#EAFBFF" stroke-width="2.6" stroke-linecap="round"/>
        <circle cx="33" cy="10.25" r="2.3" fill="#14D8FF"/>
      </svg>
    </div>
    <div class="copy">
      <div class="eyebrow"><span class="wordmark">TOP<span>FRAGG</span></span><span class="live-label">Your competitive home</span></div>
      <div class="messages" aria-hidden="true">
        <section class="message" style="--i:0"><h1><strong>FREE ENTRY</strong> TOURNAMENTS</h1><p>Bring your team. Play to win.</p></section>
        <section class="message" style="--i:1"><h2>FIRST <strong>250</strong> TO SIGN UP</h2><p>Get <strong>5 free credits</strong> to start your run.</p></section>
        <section class="message" style="--i:2"><h2><strong>XP LADDERS.</strong> CASH PRIZES.</h2><p>Compete. Climb. Make your mark.</p></section>
        <section class="message" style="--i:3"><h2>YOUR NEXT WIN <strong>STARTS HERE.</strong></h2><p>Sign up at <strong>topfragg.gg</strong></p></section>
      </div>
      <div class="footer"><a href="https://topfragg.gg/" target="_blank" rel="noopener">TOPFRAGG.GG</a><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M3 8h10M8 3l5 5-5 5"/></svg><span>COMPETE. WIN. CLIMB.</span></div>
    </div>
    <div class="progress" aria-hidden="true"></div>
  </aside>
</body>
</html>
