<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TopFragg · 22 bewegende items</title><style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;color:#eaf3ff;background:#08111b}*{box-sizing:border-box}body{margin:0;padding:36px 22px}main{max-width:1500px;margin:auto}header{display:flex;justify-content:space-between;align-items:center;gap:24px;margin-bottom:32px}h1{font-size:clamp(24px,4vw,44px);letter-spacing:-.04em;margin:10px 0}header p{color:#9cb5ca;line-height:1.7;max-width:850px}header small{color:#57dfff;text-transform:uppercase;letter-spacing:.16em;font-weight:800}button,a{color:#c6a6ff}button{padding:12px 17px;border:1px solid #8e71bd;border-radius:10px;background:#192338;cursor:pointer;white-space:nowrap}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,285px),1fr));gap:20px}article{overflow:hidden;border:1px solid #24394c;border-radius:16px;background:#0e1b29}article:is(:hover,:focus-within){border-color:#aa80fa}picture{position:relative;display:block;width:100%;aspect-ratio:1;background:#08111b}picture>img,picture>canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}canvas{pointer-events:none;opacity:0}.copy{padding:20px}.copy>span{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#ac91d4}h2{font-size:17px;margin:10px 0}.copy p{font-size:12px;line-height:1.8;color:#9fb4c8}.copy a{font-size:11px;display:inline-block;margin:12px 12px 0 0}.credit{font-size:10px;color:#7995b0;margin-top:14px}.state{display:block;font-size:10px;color:#64d8c6;margin-top:12px}:is(button,a):focus-visible{outline:2px solid #7ce9ff;outline-offset:4px}@media(max-width:600px){header{align-items:flex-start;flex-direction:column}body{padding:22px 14px}}
</style></head><body><main><header><div><small>TopFragg · First Drop</small><h1>22 items met jouw bewegende beelden.</h1><p>De aangeleverde GIFs spelen als materiaal in de wapens en emblemen. Maximaal twee items bewegen tegelijk. Ga over een kaart om die animatie te bekijken of open de vergelijking op groot formaat.</p></div><button id="motion" aria-pressed="false">Animaties pauzeren</button></header><p id="status" role="status">Items laden…</p><section class="grid" id="grid"></section></main>
<script type="module">
import { createDarkMatterRenderer } from './assets/rewards/dark-matter-material.js?v=2';
const rows=[],grid=document.querySelector('#grid'),button=document.querySelector('#motion'),status=document.querySelector('#status'),media=matchMedia('(prefers-reduced-motion: reduce)');let paused=false;
function stop(row){row.renderer?.dispose();row.renderer=null;row.canvas?.remove();row.canvas=null;row.state.textContent=row.failed?'Stilstaand beeld op dit apparaat':'Stilstaand · ga over de kaart om af te spelen';}
function update(){
 const enabled=!paused&&!document.hidden&&!media.matches;
 const selected=new Set(enabled?rows.filter(row=>row.visible&&!row.failed).sort((a,b)=>Number(b.hover||b.focus)-Number(a.hover||a.focus)||a.index-b.index).slice(0,2):[]);
 rows.forEach(row=>{if(!selected.has(row))stop(row);});
 selected.forEach(row=>{
  if(row.renderer)return;
  const canvas=document.createElement('canvas');canvas.width=1;canvas.height=1;canvas.setAttribute('aria-hidden','true');row.canvas=canvas;row.picture.append(canvas);row.state.textContent='Bronanimatie laden…';
  row.renderer=createDarkMatterRenderer(canvas,{source:row.item.poster,mask:row.item.mask,video:row.item.video,zoom:row.item.zoom,priority:row.hover||row.focus?10:0,onReady(){if(row.canvas===canvas){canvas.style.opacity='1';row.state.textContent='Speelt · jouw bronanimatie';}},onPause(){if(row.canvas===canvas)canvas.style.opacity='0';},onFailure(){if(row.canvas!==canvas)return;row.failed=true;queueMicrotask(update);}});
 });
}
const observer=new IntersectionObserver(entries=>{entries.forEach(entry=>{const row=rows.find(row=>row.picture===entry.target);if(row)row.visible=entry.isIntersecting&&entry.intersectionRatio>=.05;});update();},{threshold:.05});
try{
 const response=await fetch('./assets/rewards/material-loops/items.json?v=2');if(!response.ok)throw new Error('Items unavailable');const items=await response.json();
 for(const [index,item] of items.entries()){
  const article=document.createElement('article'),picture=document.createElement('picture'),image=document.createElement('img'),copy=document.createElement('div'),rarity=document.createElement('span'),name=document.createElement('h2'),description=document.createElement('p'),compare=document.createElement('a'),source=document.createElement('a'),credit=document.createElement('div'),state=document.createElement('small');
  image.src=item.poster;image.alt=item.name;image.loading='lazy';image.decoding='async';image.width=768;image.height=768;picture.append(image);copy.className='copy';rarity.textContent=item.rarity;name.textContent=item.name;description.textContent=item.description;compare.href=`./dark-matter-preview.html?item=${encodeURIComponent(item.id)}`;compare.textContent='Groot vergelijken →';source.href=item.video;source.target='_blank';source.rel='noopener';source.textContent='Bronanimatie ↗';credit.className='credit';credit.textContent=`Animatie: ${item.creator}`;state.className='state';state.textContent='Stilstaand · ga over de kaart om af te spelen';copy.append(rarity,name,description,compare,source,credit,state);article.append(picture,copy);grid.append(article);
  const row={item,index,picture,state,visible:false,hover:false,focus:false,renderer:null,canvas:null,failed:false};rows.push(row);
  article.addEventListener('pointerenter',()=>{row.hover=true;update();});article.addEventListener('pointerleave',()=>{row.hover=false;update();});article.addEventListener('focusin',()=>{row.focus=true;update();});article.addEventListener('focusout',event=>{if(!article.contains(event.relatedTarget)){row.focus=false;update();}});observer.observe(picture);
 }
 status.hidden=true;
}catch{status.textContent='De items konden niet worden geladen.';}
button.addEventListener('click',()=>{paused=!paused;button.setAttribute('aria-pressed',String(paused));button.textContent=paused?'Animaties hervatten':'Animaties pauzeren';update();});document.addEventListener('visibilitychange',update);media.addEventListener('change',update);window.addEventListener('pagehide',()=>rows.forEach(stop));window.addEventListener('pageshow',update);
</script></body></html>
